# config/scoring.yaml
# 评分权重配置（精简版 - 移除技术能力的行业检测配置）
# 更新日期: 2026-01-30

# ============ 总体权重配置 ============
weights:
  technical: 0.35   # 技术能力 25%
  experience: 0.20  # 经验背景 20%
  project: 0.40     # 项目经验 40%
  soft_skill: 0.05  # 软技能 15%


# ============ 经验背景评分配置 ============

# 学校分级配置
school_tier:
  985:
    - 清华大学
    - 北京大学
    - 复旦大学
    - 上海交通大学
    - 浙江大学
    - 中国科学技术大学
    - 南京大学
    - 西安交通大学
    - 哈尔滨工业大学
  211:
    - 北京理工大学
    - 北京航空航天大学
    - 同济大学
    - 南开大学
    - 天津大学

# 经验背景维度权重
experience_dimension_weights:
  education: 0.50    # 教育背景 30%
  work: 0.50         # 工作经验 70%
  internship: 0.01   # 实习经验 0%

# 学历层次加分（用于教育背景评分）
degree_scores:
  博士: 100
  phd: 100
  ph.d: 100
  硕士: 80
  研究生: 80
  master: 80
  本科: 60
  学士: 60
  bachelor: 60
  大专: 50
  专科: 50
  associate: 50

# 学校层次加分（用于教育背景评分）
school_tier_scores:
  "985": 100
  "211": 100
  普通: 80

# 工作经验评分配置
work_experience_scoring:
  score_per_year: 20      # 每年得分
  max_score: 100           # 最高分（封顶）
  cap_years: 3            # 达到最高分所需的年限

# 实习经验评分配置
internship_scoring:
  score_per_month: 33.2   # 每月得分（10分/12月 ≈ 0.83）
  max_score: 100           # 最高分（封顶）
  cap_months: 4          # 达到最高分所需的月数


# ============ 项目经验评分配置 ============
# 注意：项目评分已改用极简评分器（SimpleProjectAnalyzer）
# 评分规则已内置在代码中，无需额外配置
