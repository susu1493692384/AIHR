# ========================================
# 添加新行业示例：教育行业
# ========================================
#
# 本示例展示如何在 config/scoring.yaml 中添加新行业
#
# ========================================

# 步骤1: 在 industry_detection 部分添加行业定义
# -------------------------------------------

industry_detection:
  # ... 现有行业保持不变 ...

  # 新增：教育行业
  education:
    name: "教育行业"
    position_keywords:  # 职位关键词，用于自动识别行业
      - "教师"
      - "讲师"
      - "教授"
      - "老师"
      - "培训师"
      - "教学"
      - "教育"
      - "班主任"
      - "辅导员"
    skill_categories:  # 技能类别及权重
      teaching_skills: {weight: 0.35, name: "教学技能"}
      subject_knowledge: {weight: 0.30, name: "学科知识"}
      educational_tools: {weight: 0.20, name: "教育工具"}
      research: {weight: 0.15, name: "教研能力"}

# 步骤2: 在 skill_categories 部分添加技能关键词
# -------------------------------------------

skill_categories:
  # ... 现有类别保持不变 ...

  # 教育行业技能关键词
  teaching_skills:
    - 教学设计
    - 课程开发
    - 课堂管理
    - 学生评估
    - 教学法
    - 启发式教学
    - 互动教学
    - 分层教学
    - 课程设计
    - 教案设计

  subject_knowledge:
    - 数学
    - 语文
    - 英语
    - 物理
    - 化学
    - 生物
    - 历史
    - 地理
    - 政治

  educational_tools:
    - ppt
    - 多媒体教学
    - 在线教学平台
    - 钉钉
    - 腾讯会议
    - zoom
    - 雨课堂
    - 学习通
    - 慕课
    - 智慧课堂

  research:
    - 教学研究
    - 论文发表
    - 课题研究
    - 教改
    - 教育科研
    - 教学成果
    - 课程改革

