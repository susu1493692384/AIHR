# ========================================
# 使用说明
# ========================================
#
# 1. 将上述配置添加到 config/scoring.yaml 的对应位置
# 2. 重启应用程序
# 3. 系统将自动识别新行业
#
# 检测逻辑：
# - 从工作经历和项目经验的职位/角色中提取关键词
# - 匹配 position_keywords 列表
# - 自动应用对应行业的 skill_categories 权重
# - 使用 skill_categories 关键词表自动分类技能
#
# 评分示例：
# 简历职位: "高中数学教师"
# 识别行业: education
# 技能: [教学设计(精通), 数学(精通), PPT(熟练)]
#
# 评分计算:
# - teaching_skills: 80 × 0.35 = 28.00
# - subject_knowledge: 80 × 0.30 = 24.00
# - educational_tools: 40 × 0.20 = 8.00
# - research: 0 × 0.15 = 0.00
# - 总分: (28+24+8) / 80 × 100 = 75.00
#
# ========================================
